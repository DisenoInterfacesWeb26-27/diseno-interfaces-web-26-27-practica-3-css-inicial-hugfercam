<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica DIW | Contacto y Ubicación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/print.css" media="print">

    <meta
    name="description"
    content="Conoce Clínica DIW, Consulta nuestros datos de contacto y utiliza el formulario para solicitar información."
    >
    <meta name="keywords"
          content="clínica dental, Alicante, implantes, ortodoncia, estética dental">

    <meta name="author"
          content="Hugo Fernández Campos">

    <meta name="copyright"
          content="2026 Clínica DIW - Proyecto Desarollo de interfaz web">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
    <header><!-- Cabecera clinica DIW -->
        <a href="index.html">
            <img src="assets/img/logo-diw.png"
            alt="Clinica DIW - Ir a inicio"
            width="180"
            >
        </a>
        <h1>Clínica DIW</h1>
    </header>
    <nav><!-- Menu de navegación -->
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="contacto.html">Contacto</a>        
    </nav>
    <main>
        <h1>Contacto</h1>
        <form>
            <label for="nombre">Nombre</label>
            <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Introduce tu nombre"
            maxlength="40"
            pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ]+"
            title="Introduce únicamente letras y números"
            required
            autofocus
            >
            
            <label for="email">Correo electronico</label>
            <input
            type="email"
            id="email"
            name="email"
            placeholder="Introduce su email"
            required
            >
            
            <label for="edad">Edad</label>
            <input
            type="number"
            id="edad"
            name="edad"
            placeholder="Introduce su edad"
            min="18"
            max="99"
            step="1"
            required
            >
            
            <label for="telefono">Teléfono</label>
            <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="Introduce tu teléfono"
            pattern="[0-9]{9}"
            maxlength="9"
            required
            >            
            <label for="consulta">Motivo de la consulta</label>
            <br>
            <textarea
            id="consulta"
            name="consulta"
            rows="5"
            cols="40"
            placeholder="Introduce tu consulta"
            required></textarea>            
            <input
            type="checkbox"
            id="privacidad"
            name="privacidad"
            required
            >
            <label for="privacidad">
                Acepto la
                <a href="privacidad.html">política de privacidad</a>
                y la
                <a href="cookies.html">política de cookies</a>
            </label>            
            <br>
            <button type="submit">Enviar</button>            
            
        </form>
        <section>
            <h2>Datos de contacto</h2>
            <p>Clinica DIW - Alicante</p>
            <p>
                Teléfono:
                <a href="tel:+34995000000">995 00 00 00</a>
            </p>
        </section>
    </main>
</body>
</html>
